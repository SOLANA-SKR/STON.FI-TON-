<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tether Style Animation</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; /* Убираем скролл для демо */
            background-color: #000; 
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1; /* Чтобы текст был поверх анимации */
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Настройка сцены
        const scene = new THREE.Scene();
        // Добавляем легкий туман, чтобы сфера плавно уходила в темноту (как на Tether)
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Для четкости на iPhone/Mac
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Создание Глобуса (Сферы)
        // IcosahedronGeometry дает "треугольную" сетку, похожую на Tether
        const geometry = new THREE.IcosahedronGeometry(10, 2); 

        // Материал: Зеленые линии (Wireframe)
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00ffa3, // Фирменный цвет Tether (бирюзово-зеленый)
            wireframe: true,
            transparent: true,
            opacity: 0.5
        });

        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // 3. Дополнительная "аура" внутри (чтобы сфера не казалась пустой)
        const innerGeometry = new THREE.IcosahedronGeometry(9.8, 2);
        const innerMaterial = new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.9
        });
        const innerSphere = new THREE.Mesh(innerGeometry, innerMaterial);
        scene.add(innerSphere);

        // 4. Частицы вокруг (звезды/пыль)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 700;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Раскидываем частицы вокруг сферы
            posArray[i] = (Math.random() - 0.5) * 50;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0x00ffa3,
            transparent: true,
            opacity: 0.8
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Позиция камеры
        camera.position.z = 22;

        // 5. Анимация
        // Переменные для отслеживания мыши (эффект параллакса)
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX - window.innerWidth / 2;
            mouseY = event.clientY - window.innerHeight / 2;
        });

        function animate() {
            requestAnimationFrame(animate);

            // Вращение сферы
            sphere.rotation.y += 0.002;
            sphere.rotation.x += 0.001;
            
            // Вращение частиц (в обратную сторону для глубины)
            particlesMesh.rotation.y -= 0.0005;

            // Легкий наклон за мышкой (параллакс эффект как на Tether)
            camera.position.x += (mouseX * 0.005 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.005 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();

        // 6. Адаптивность (если меняют размер окна)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
