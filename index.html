<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKR Protocol | Innovation Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #008080; 
            --text: #111;
            --bg: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Кнопки навигации */
        .header-nav {
            position: fixed;
            top: 25px;
            right: 30px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .btn-nav {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 128, 128, 0.2);
        }

        .btn-nav:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* Сетка макета */
        .layout {
            display: grid;
            grid-template-columns: 45% 55%;
            width: 100vw;
            height: 100vh;
        }

        /* Левая панель с текстом */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 12%;
            z-index: 10;
        }

        /* --- АНИМАЦИИ ТЕКСТА --- */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.5s; }

        h1 {
            font-size: clamp(40px, 5vw, 64px);
            font-weight: 800;
            line-height: 1.1;
            margin: 0 0 25px 0;
            letter-spacing: -2px;
        }

        h1 span { color: var(--primary); }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: #555;
            max-width: 500px;
        }

        /* Правая панель с графикой */
        .visual-panel {
            position: relative;
            overflow: hidden;
        }

        #canvas-box { width: 100%; height: 100%; }

        @media (max-width: 1000px) {
            .layout { grid-template-columns: 100%; }
            .info-panel { padding: 100px 5% 0; text-align: center; align-items: center; }
            .visual-panel { height: 50vh; }
            .header-nav { width: 100%; right: 0; justify-content: center; top: 10px; }
        }
    </style>
</head>
<body>

<nav class="header-nav">
    <button class="btn-nav">Connect Wallet</button>
    <button class="btn-nav">Exclusive Airdrop</button>
    <button class="btn-nav">Participate in Giveaway</button>
</nav>

<div class="layout">
    <div class="info-panel">
        <h1 class="fade-in delay-1">Global<br><span>SKR Protocol</span><br>Network.</h1>
        <p class="fade-in delay-2">
            Disrupting the traditional financial system and paving the way for the digital use of traditional currencies. 
            We support and empower growing enterprises and innovations within the blockchain space, 
            driving the future of decentralized finance.
        </p>
    </div>

    <div class="visual-panel">
        <div id="canvas-box"></div>
    </div>
</div>

<script>
    const box = document.getElementById('canvas-box');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(50, box.clientWidth / box.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(box.clientWidth, box.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    box.appendChild(renderer.domElement);

    const group = new THREE.Group();
    scene.add(group);

    // СФЕРА (Размер 11 - оптимальный, не огромный)
    const geo = new THREE.IcosahedronGeometry(11, 2); 
    const mat = new THREE.MeshBasicMaterial({
        color: 0x008080,
        wireframe: true,
        transparent: true,
        opacity: 0.15
    });
    group.add(new THREE.Mesh(geo, mat));

    // Монеты
    const loader = new THREE.TextureLoader();
    const t1 = loader.load('https://cryptologos.cc/logos/tether-usdt-logo.png?v=029');
    const t2 = loader.load('https://cryptologos.cc/logos/usd-coin-usdc-logo.png?v=029');

    const coins = [];
    for(let i=0; i<25; i++) {
        const tex = Math.random() > 0.5 ? t1 : t2;
        const cGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.1, 32);
        const cMat = [
            new THREE.MeshStandardMaterial({ color: 0xdddddd }),
            new THREE.MeshStandardMaterial({ map: tex }),
            new THREE.MeshStandardMaterial({ map: tex })
        ];
        const coin = new THREE.Mesh(cGeo, cMat);
        coin.rotation.x = Math.PI/2;

        const pivot = new THREE.Group();
        group.add(pivot);

        const r = i < 10 ? (5 + Math.random()*5) : (13 + Math.random()*8);
        coin.position.set(r, 0, 0);
        pivot.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
        pivot.add(coin);
        coins.push({ pivot, speed: 0.002 + Math.random()*0.003, coin });
    }

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    camera.position.z = 28;

    let mx = 0, my = 0;
    document.addEventListener('mousemove', (e) => {
        mx = (e.clientX / window.innerWidth - 0.5);
        my = (e.clientY / window.innerHeight - 0.5);
    });

    function anim() {
        requestAnimationFrame(anim);
        group.rotation.y += 0.001;
        coins.forEach(c => {
            c.pivot.rotation.y += c.speed;
            c.coin.rotation.z += 0.01;
        });
        camera.position.x += (mx * 6 - camera.position.x) * 0.05;
        camera.position.y += (-my * 6 - camera.position.y) * 0.05;
        camera.lookAt(0,0,0);
        renderer.render(scene, camera);
    }
    anim();

    window.addEventListener('resize', () => {
        camera.aspect = box.clientWidth / box.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(box.clientWidth, box.clientHeight);
    });
</script>

</body>
</html>
