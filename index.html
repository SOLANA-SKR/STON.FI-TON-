<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKR Ecosystem Orbit</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; /* Очень темный фон */
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
            /* Можно использовать как фон для контента */
            /* position: fixed; z-index: -1; top:0; left:0; */
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- НАСТРОЙКА СЦЕНЫ ---
        const scene = new THREE.Scene();
        // Мягкий туман для глубины
        scene.fog = new THREE.FogExp2(0x050505, 0.0015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 35; // Отодвигаем камеру, чтобы видеть орбиты

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Добавляем свет, чтобы монеты не были плоскими
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(20, 20, 20);
        scene.add(pointLight);

        // --- ЦЕНТРАЛЬНАЯ СФЕРА (SKR HUB) ---
        const coreGeometry = new THREE.IcosahedronGeometry(8, 1);
        const coreMaterial = new THREE.MeshBasicMaterial({
            color: 0x14f195, // Твой зеленый цвет SKR
            wireframe: true,
            transparent: true,
            opacity: 0.5
        });
        const coreSphere = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(coreSphere);

        // Внутреннее черное ядро (чтобы скрыть задние линии)
        const innerCoreGeo = new THREE.IcosahedronGeometry(7.8, 1);
        const innerCoreMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
        scene.add(new THREE.Mesh(innerCoreGeo, innerCoreMat));


        // --- СОЗДАНИЕ МОНЕТ (USDT / USDC) ---
        const textureLoader = new THREE.TextureLoader();
        // URL текстур с публичного CDN
        const usdtTexture = textureLoader.load('https://cryptologos.cc/logos/tether-usdt-logo.png?v=029');
        const usdcTexture = textureLoader.load('https://cryptologos.cc/logos/usd-coin-usdc-logo.png?v=029');

        const coins = [];
        const orbitGroups = []; // Группы для вращения по орбите
        const numCoins = 30; // Количество монет

        // Геометрия монеты (плоский цилиндр)
        const coinGeometry = new THREE.CylinderGeometry(1, 1, 0.1, 32);

        for (let i = 0; i < numCoins; i++) {
            // Выбираем случайно USDT или USDC
            let isUsdt = Math.random() > 0.5;
            let texture = isUsdt ? usdtTexture : usdcTexture;
            
            // Материалы для монеты: бока серые, верх/низ с текстурой
            const materials = [
                new THREE.MeshStandardMaterial({ color: 0x888888 }), // Боковая грань
                new THREE.MeshStandardMaterial({ map: texture, transparent: true }), // Верх
                new THREE.MeshStandardMaterial({ map: texture, transparent: true })  // Низ
            ];

            const coin = new THREE.Mesh(coinGeometry, materials);
            // Поворачиваем, чтобы "лицо" монеты смотрело на нас
            coin.rotation.x = Math.PI / 2; 
            
            // --- ОРБИТАЛЬНАЯ МЕХАНИКА ---
            // Создаем невидимую группу-пивот в центре
            const pivotGroup = new THREE.Group();
            scene.add(pivotGroup);

            // Случайные параметры орбиты
            const radius = 12 + Math.random() * 15; // Расстояние от центра (от 12 до 27)
            const angle = Math.random() * Math.PI * 2; // Начальный угол
            // Случайный наклон орбиты по всем осям для объема
            pivotGroup.rotation.x = Math.random() * Math.PI * 2;
            pivotGroup.rotation.y = Math.random() * Math.PI * 2;
            pivotGroup.rotation.z = Math.random() * Math.PI * 2;

            // Ставим монету на край этой орбиты
            coin.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            
            // Добавляем монету в группу-пивот
            pivotGroup.add(coin);

            // Сохраняем данные для анимации
            orbitGroups.push({
                group: pivotGroup,
                rotationSpeed: (Math.random() * 0.004 + 0.001) * (Math.random() > 0.5 ? 1 : -1), // Случайная скорость и направление
                coinMesh: coin,
                selfRotationSpeed: Math.random() * 0.02 // Скорость вращения самой монеты вокруг оси
            });
        }

        // --- АНИМАЦИЯ ---
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.01;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.01;
        });

        function animate() {
            requestAnimationFrame(animate);

            // Вращение центральной сферы
            coreSphere.rotation.y += 0.002;
            coreSphere.rotation.z += 0.001;

            // Вращение орбит и монет
            orbitGroups.forEach(item => {
                // Вращаем всю группу вокруг центра сцены (орбита)
                item.group.rotation.y += item.rotationSpeed;
                // Вращаем саму монету вокруг своей оси для динамики
                item.coinMesh.rotation.z += item.selfRotationSpeed;
            });

            // Параллакс эффект камеры от мыши
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();

        // Адаптивность
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
