<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKR Protocol | White Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary-marine: #008080; 
            --text-dark: #111111;
            --bg-white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-white);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            height: 100%;
        }

        /* Кнопки в правом верхнем углу */
        .top-nav {
            position: fixed;
            top: 25px;
            right: 30px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .nav-btn {
            background-color: var(--primary-marine);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 128, 128, 0.15);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Основной контейнер */
        .main-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            align-items: center;
        }

        /* Левая часть - Текст */
        .text-side {
            width: 45%;
            padding-left: 8%;
            z-index: 10;
        }

        /* Правая часть - 3D */
        .canvas-side {
            width: 55%;
            height: 100%;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 62px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        h1 span { color: var(--primary-marine); }

        p {
            font-size: 19px;
            line-height: 1.5;
            color: #444;
            max-width: 480px;
        }

        @media (max-width: 1100px) {
            .main-wrapper { flex-direction: column; }
            .text-side { width: 90%; padding: 100px 5% 0; text-align: center; }
            .text-side p { margin: 0 auto; }
            .canvas-side { width: 100%; height: 50%; }
            .top-nav { width: 100%; right: 0; justify-content: center; top: 10px; }
        }
    </style>
</head>
<body>

<nav class="top-nav">
    <button class="nav-btn">Connect Wallet</button>
    <button class="nav-btn">Exclusive Airdrop</button>
    <button class="nav-btn">Participate in Giveaway</button>
</nav>

<div class="main-wrapper">
    <div class="text-side">
        <h1>Global<br><span>SKR Protocol</span><br>Network.</h1>
        <p>
            Масштабируемая экосистема ликвидности. Управляйте активами USDT и USDC в едином безопасном пространстве, созданном для мобильных устройств.
        </p>
    </div>

    <div class="canvas-side">
        <div id="canvas-container"></div>
    </div>
</div>

<script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    const group = new THREE.Group();
    scene.add(group);

    // Большая сфера
    const coreGeo = new THREE.IcosahedronGeometry(12, 2); 
    const coreMat = new THREE.MeshBasicMaterial({
        color: 0x008080,
        wireframe: true,
        transparent: true,
        opacity: 0.15
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    group.add(coreMesh);

    // Монеты
    const textureLoader = new THREE.TextureLoader();
    const usdtTex = textureLoader.load('https://cryptologos.cc/logos/tether-usdt-logo.png?v=029');
    const usdcTex = textureLoader.load('https://cryptologos.cc/logos/usd-coin-usdc-logo.png?v=029');

    const orbits = [];
    for(let i=0; i<28; i++) {
        const tex = Math.random() > 0.5 ? usdtTex : usdcTex;
        const coinGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.1, 32);
        const coinMat = [
            new THREE.MeshStandardMaterial({ color: 0xdddddd }),
            new THREE.MeshStandardMaterial({ map: tex }),
            new THREE.MeshStandardMaterial({ map: tex })
        ];
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI/2;

        const pivot = new THREE.Group();
        group.add(pivot);

        const radius = i < 12 ? (5 + Math.random()*6) : (14 + Math.random()*8);
        coin.position.set(radius, 0, 0);
        pivot.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
        pivot.add(coin);

        orbits.push({ pivot, speed: 0.002 + Math.random()*0.005, coin });
    }

    camera.position.z = 28;

    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5);
        mouseY = (e.clientY / window.innerHeight - 0.5);
    });

    function animate() {
        requestAnimationFrame(animate);
        group.rotation.y += 0.001;
        orbits.forEach(o => {
            o.pivot.rotation.y += o.speed;
            o.coin.rotation.z += 0.01;
        });

        camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
        camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });
</script>

</body>
</html>
