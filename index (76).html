<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKR Protocol | Final Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #008080; 
            --text: #111;
            --bg: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Кнопки в углу */
        .header-nav {
            position: fixed;
            top: 25px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .btn-nav {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-nav:hover { transform: translateY(-2px); opacity: 0.9; }

        /* Главная сетка */
        .layout {
            display: grid;
            grid-template-columns: 45% 55%; /* Текст слева, Сфера справа */
            width: 100vw;
            height: 100vh;
        }

        /* Секция с текстом */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 15%;
            z-index: 10;
        }

        h1 {
            font-size: 68px;
            font-weight: 800;
            line-height: 1;
            margin: 0 0 20px 0;
            letter-spacing: -3px;
        }

        h1 span { color: var(--primary); }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
            max-width: 450px;
        }

        /* Секция со сферой */
        .visual-panel {
            position: relative;
            width: 100%;
            height: 100%;
            /* Убираем любые перекрытия */
            overflow: hidden;
        }

        #canvas-box {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 1000px) {
            .layout { grid-template-columns: 100%; }
            .info-panel { padding: 80px 5% 0; text-align: center; align-items: center; }
            .visual-panel { height: 50vh; }
            .header-nav { width: 100%; right: 0; justify-content: center; top: 10px; }
        }
    </style>
</head>
<body>

<nav class="header-nav">
    <button class="btn-nav">Connect Wallet</button>
    <button class="btn-nav">Exclusive Airdrop</button>
    <button class="btn-nav">Participate in Giveaway</button>
</nav>

<div class="layout">
    <div class="info-panel">
        <h1>Global<br><span>SKR Protocol</span><br>Network.</h1>
        <p>
            Масштабируемая экосистема ликвидности. Управляйте активами USDT и USDC в едином безопасном пространстве.
        </p>
    </div>

    <div class="visual-panel">
        <div id="canvas-box"></div>
    </div>
</div>

<script>
    const box = document.getElementById('canvas-box');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(50, box.clientWidth / box.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(box.clientWidth, box.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    box.appendChild(renderer.domElement);

    const group = new THREE.Group();
    scene.add(group);

    // Большая сфера (размер 15 вместо 12)
    const geo = new THREE.IcosahedronGeometry(15, 2); 
    const mat = new THREE.MeshBasicMaterial({
        color: 0x008080,
        wireframe: true,
        transparent: true,
        opacity: 0.12
    });
    group.add(new THREE.Mesh(geo, mat));

    // Монеты
    const loader = new THREE.TextureLoader();
    const t1 = loader.load('https://cryptologos.cc/logos/tether-usdt-logo.png?v=029');
    const t2 = loader.load('https://cryptologos.cc/logos/usd-coin-usdc-logo.png?v=029');

    const coins = [];
    for(let i=0; i<30; i++) {
        const tex = Math.random() > 0.5 ? t1 : t2;
        const cGeo = new THREE.CylinderGeometry(1, 1, 0.15, 32);
        const cMat = [
            new THREE.MeshStandardMaterial({ color: 0xeeeeee }),
            new THREE.MeshStandardMaterial({ map: tex }),
            new THREE.MeshStandardMaterial({ map: tex })
        ];
        const coin = new THREE.Mesh(cGeo, cMat);
        coin.rotation.x = Math.PI/2;

        const pivot = new THREE.Group();
        group.add(pivot);

        // Распределение: монеты теперь летают шире
        const r = i < 10 ? (7 + Math.random()*7) : (16 + Math.random()*10);
        coin.position.set(r, 0, 0);
        pivot.rotation.set(Math.random()*10, Math.random()*10, Math.random()*10);
        pivot.add(coin);
        coins.push({ pivot, speed: 0.002 + Math.random()*0.004, coin });
    }

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    camera.position.z = 35; // Отдаляем камеру, так как сфера стала больше

    let mx = 0, my = 0;
    document.addEventListener('mousemove', (e) => {
        mx = (e.clientX / window.innerWidth - 0.5);
        my = (e.clientY / window.innerHeight - 0.5);
    });

    function anim() {
        requestAnimationFrame(anim);
        group.rotation.y += 0.001;
        coins.forEach(c => {
            c.pivot.rotation.y += c.speed;
            c.coin.rotation.z += 0.01;
        });
        camera.position.x += (mx * 8 - camera.position.x) * 0.05;
        camera.position.y += (-my * 8 - camera.position.y) * 0.05;
        camera.lookAt(0,0,0);
        renderer.render(scene, camera);
    }
    anim();

    window.addEventListener('resize', () => {
        camera.aspect = box.clientWidth / box.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(box.clientWidth, box.clientHeight);
    });
</script>

</body>
</html>
